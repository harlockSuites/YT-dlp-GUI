# Essai : construire les fichiers avec un lanceur PyInstaller compilé depuis ses sources.
#
# Le lanceur fourni par PyInstaller est signalé par des antivirus (Microsoft Defender, CrowdStrike, Zillya…).
# Cet essai produit un artefact téléchargeable, à soumettre à VirusTotal pour comparer avec la version publiée.
# Il ne publie rien (aucune étiquette, aucune release) : lancement manuel seulement (« Run workflow »).
name: Essai lanceur compilé

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les outils de construction
        run: python -m pip install -r packaging/requirements-build.txt

      - name: Compiler le lanceur PyInstaller depuis ses sources
        run: python -X utf8 packaging/build_bootloader.py

      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Construire l'exécutable, la version portable et l'installateur
        run: python -X utf8 packaging/build.py

      - name: Sommes de contrôle
        run: python -X utf8 packaging/release_tools.py checksums --dir dist --out dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: yt-dlp-gui-windows-lanceur-compile
          path: |
            dist/yt-dlp-gui-setup-*.exe
            dist/yt-dlp-gui-portable-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
