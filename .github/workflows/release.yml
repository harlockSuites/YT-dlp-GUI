# Publication d'une version LINUX (préversion GitHub). La version Windows (étiquettes v*) est figée à la 0.1.7 et se
# publie avec le workflow de la branche main : celui-ci ne la construit pas et ne réagit qu'aux étiquettes « Linux-v* ».
#
# Pour publier : 1) vérifier __version__ dans yt-dlp-gui.pyw ; 2) dater la section de cette version dans
# CHANGELOG-linux.md ; 3) commiter et pousser la branche Linux ; 4) créer et pousser l'étiquette correspondante :
#     git tag Linux-v0.1.0 && git push origin Linux-v0.1.0
# Le workflow lance les tests, construit l'AppImage, l'archive .tar.gz et le paquet .deb, calcule les sommes SHA-256 puis crée la
# release GitHub **en préversion** (jamais « dernière version » : la recherche de mise à jour du logiciel Windows
# interroge la dernière version et ne doit pas y trouver une étiquette Linux) avec les notes de CHANGELOG-linux.md.
# Lancé à la main (« Run workflow »), il construit seulement les fichiers sans publier.
name: Release Linux

on:
  push:
    tags: ["Linux-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Vérifier que l'étiquette correspond à la version du code
        if: startsWith(github.ref, 'refs/tags/Linux-v')
        run: python3 -X utf8 packaging/release_tools.py check-tag "${{ github.ref_name }}" --prefix Linux-v

      - name: Installer Tk, un écran virtuel et les outils de construction
        run: |
          sudo apt-get update && sudo apt-get install -y tk8.6 xvfb
          python3 -m pip install -r packaging/requirements-build.txt

      - name: Tests
        run: xvfb-run -a python3 -X utf8 -m unittest discover -s tests -t .

      - name: Installer appimagetool (version et somme de contrôle fixées)
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - name: Construire l'archive et l'AppImage
        run: python3 -X utf8 packaging/build_linux.py

      - name: Construire le paquet .deb
        run: |
          python3 -X utf8 packaging/build_deb.py
          dpkg-deb --info dist/yt-dlp-gui_*_amd64.deb
          dpkg-deb --contents dist/yt-dlp-gui_*_amd64.deb | head -40

      - name: Notes de version et sommes de contrôle
        run: |
          python3 -X utf8 packaging/release_tools.py notes --changelog CHANGELOG-linux.md --out dist/release-notes.md
          python3 -X utf8 packaging/release_tools.py checksums --platform linux --dir dist --out dist/SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v7
        with:
          name: yt-dlp-gui-linux
          path: |
            dist/yt-dlp-gui-*-x86_64.AppImage
            dist/yt-dlp-gui-linux-*-x86_64.tar.gz
            dist/yt-dlp-gui_*_amd64.deb
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error

      - name: Publier la préversion Linux
        if: startsWith(github.ref, 'refs/tags/Linux-v')
        uses: softprops/action-gh-release@v3
        with:
          name: yt-dlp GUI ${{ github.ref_name }} (préversion)
          body_path: dist/release-notes.md
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true
          files: |
            dist/yt-dlp-gui-*-x86_64.AppImage
            dist/yt-dlp-gui-linux-*-x86_64.tar.gz
            dist/yt-dlp-gui_*_amd64.deb
            dist/SHA256SUMS-linux.txt
